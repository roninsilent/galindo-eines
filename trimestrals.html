<style>
/* Galindo grup — base comuna de les eines internes.
   Columna de treball única; capçalera amb el monograma i menú entre eines; gris càlid de marca sobre blanc. */
:root{
  --bg:#f6f5f3; --surface:#ffffff; --sunk:#eeebe7; --hover:#f8f7f5;
  --ink:#2a2723; --muted:#6c675f; --line:#e1ddd7; --bar:#cfc9c0;
  --brand:#a39c92; --accent:#5d564c; --accent-soft:#ece8e2; --on-accent:#ffffff;
  --info:#2f5f8a; --info-soft:#e3ebf3;
  --late:#b3391f; --late-soft:#f7e3dc;
  --soon:#8f5d00; --soon-soft:#f5ebd6;
  --ok:#36744b; --ok-soft:#e1eee4;
  --scrim:rgba(20,18,15,.45);
  --f-display:"Libre Franklin","Franklin Gothic Medium","Arial Narrow",Arial,system-ui,sans-serif;
  --f-body:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191816; --surface:#22201d; --sunk:#2c2a26; --hover:#282622;
    --ink:#ece9e4; --muted:#a8a298; --line:#38352f; --bar:#55504a;
    --brand:#a39c92; --accent:#d9d3ca; --accent-soft:#38342e; --on-accent:#191816;
    --info:#93bde6; --info-soft:#1e2c3a;
    --late:#ff8f72; --late-soft:#40221a;
    --soon:#e2b45c; --soon-soft:#3a2f17;
    --ok:#7cc896; --ok-soft:#1d3426;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191816; --surface:#22201d; --sunk:#2c2a26; --hover:#282622;
  --ink:#ece9e4; --muted:#a8a298; --line:#38352f; --bar:#55504a;
  --brand:#a39c92; --accent:#d9d3ca; --accent-soft:#38342e; --on-accent:#191816;
  --info:#93bde6; --info-soft:#1e2c3a;
  --late:#ff8f72; --late-soft:#40221a;
  --soon:#e2b45c; --soon-soft:#3a2f17;
  --ok:#7cc896; --ok-soft:#1d3426;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:14px 72px;display:flex;flex-direction:column;gap:18px}
@media (min-width:760px){.wrap{padding-inline:28px;padding-block:22px 88px;gap:22px}}

/* Capçalera corporativa */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{display:block;width:37px;height:40px;flex:none}
.wm{display:flex;flex-direction:column;align-items:center;line-height:1;color:var(--brand)}
.wm1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.005em}
.wm2{font-family:var(--f-display);font-weight:600;font-size:13px;margin-top:1px}
.apps{display:flex;gap:4px;flex-wrap:wrap}
.app{font-size:13.5px;font-weight:500;padding:6px 11px;border-radius:7px;color:var(--muted);text-decoration:none;border:1px solid transparent}
a.app:hover{background:var(--hover);color:var(--ink);border-color:var(--line)}
.app.cur{color:var(--ink);font-weight:700;background:var(--surface);border-color:var(--line)}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,6.5vw,2.75rem);line-height:1;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sub{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin:8px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--late);border-color:var(--late-soft);background:transparent}
.btn.danger[data-armed="1"]{background:var(--late);color:var(--surface);border-color:var(--late)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:3px;cursor:pointer;font-size:inherit}

.demo{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:0}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:1rem;font-weight:600;color:var(--muted)}
.stat .s{font-size:12.5px;color:var(--muted)}
.stat.alert .v{color:var(--late)}
.stat.warn .v{color:var(--soon)}
.stat.good .v{color:var(--ok)}

.filters{display:flex;flex-direction:column;gap:10px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.frow{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fside{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fside select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px}
.check{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}

.group{display:flex;flex-direction:column;gap:8px}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
.gh h2{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0;display:flex;gap:8px;align-items:center;text-wrap:balance}
.gh .dot{width:10px;height:10px;border-radius:2px;background:var(--gcol);flex:none}
.gh .n{font-family:var(--f-mono);font-weight:400;font-size:12.5px;color:var(--muted)}
.gh .gs{font-size:12.5px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}

.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);flex:none;line-height:1.5}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0}

/* Fitxa: full inferior al mòbil, panell lateral a l'escriptori */
.backdrop{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;transition:opacity .18s ease}
.backdrop.open{opacity:1}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-height:90%;overflow:auto;overscroll-behavior:contain;border-radius:14px 14px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(18px);transition:transform .2s ease;display:flex;flex-direction:column;gap:18px}
.backdrop.open .sheet{transform:none}
@media (min-width:760px){
  .backdrop{justify-content:flex-end;align-items:stretch}
  .sheet{width:480px;max-height:none;height:100%;border-radius:0;padding:calc(24px + env(safe-area-inset-top,0px)) 26px calc(32px + env(safe-area-inset-bottom,0px));transform:translateX(24px)}
}
@media (prefers-reduced-motion: reduce){.backdrop,.sheet{transition:none}}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.s-head .tag{display:inline-block;margin-bottom:6px}
.s-head h2{font-family:var(--f-display);font-weight:800;font-size:1.55rem;line-height:1.08;margin:0;text-wrap:balance}
.s-head .s-sub{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer;flex:none}
.x:hover{background:var(--hover)}
.due{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--sunk)}
.due-d{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.due-r{font-size:13.5px;color:var(--muted)}
.due.late .due-d{color:var(--late)}
.due.soon .due-d{color:var(--soon)}
.due.good .due-d{color:var(--ok)}
.note{margin:0;font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 12px}
.note b{color:var(--ink);font-weight:600}
.note.hot{border-left-color:var(--soon)}
.note.hot b{color:var(--soon)}
.note.bad{border-left-color:var(--late)}
.note.bad b{color:var(--late)}
.s-sec{display:flex;flex-direction:column;gap:8px}
.s-sec h3{margin:0;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-size:13px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mono{font-family:var(--f-mono);font-size:13.5px}
.mini{font-family:var(--f-body);font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld .opt{font-weight:400;opacity:.85}
.fld input,.fld select,.fld textarea,.sheet textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14.5px}
.sheet textarea{resize:vertical;line-height:1.45}
.msg{background:var(--sunk) !important;font-size:14px !important}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.hist li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px}
.hist time{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:1px}
.s-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.err{margin:0;color:var(--late);font-size:13.5px}
form.nf{display:flex;flex-direction:column;gap:12px}

/* Versió connectada al Drive: porta d'entrada i estat del desament */
html.locked .wrap > :not(.brandbar):not(.gate){display:none !important}
html.locked .apps{display:none}
.sync b{color:var(--ink);font-weight:600}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:540px}
.gate h2{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1.15;margin:0;text-wrap:balance}
.gate p{margin:0;color:var(--muted);max-width:60ch}
.gate p b{color:var(--ink)}
.gate code{font-family:var(--f-mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.gate-btns{display:flex;gap:8px;flex-wrap:wrap}
.sync{display:flex;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;flex-basis:100%}
@media (min-width:760px){.sync{flex-basis:auto}}
.sync .sd{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sync.s-busy .sd{background:var(--soon)}
.sync.s-err{color:var(--late)}
.sync.s-err .sd{background:var(--late)}
.brandlink{display:flex;align-items:center;gap:10px;text-decoration:none}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18)}

/* Trimestrals: terminis a dalt, graella clients × models a sota */
.camps{display:flex;gap:6px;flex-wrap:wrap}
.camp{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.camp:hover{background:var(--hover)}
.camp .c1{font-weight:600;font-size:14px}
.camp .c2{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.camp[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.camp[aria-pressed="true"] .c2{color:var(--bg);opacity:.75}
.camp .now{font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brand)}

.terms{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.tl{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:12px 14px;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .tm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);min-width:7.5em}
.tl .td{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.tl .tr{font-size:13px;color:var(--muted)}
.tl .tdom{flex-basis:100%;font-size:13px;color:var(--muted)}
.tl .tdom b{color:var(--ink);font-weight:600}
.tl.soon .td{color:var(--soon)}
.tl.past .td{color:var(--muted)}

.tblwrap{overflow-x:auto}
table.grid{width:100%;border-collapse:separate;border-spacing:0;min-width:440px}
.grid th,.grid td{padding:0;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
.grid thead th{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500;padding:9px 4px;border-top:0;background:var(--sunk)}
.grid thead th abbr{text-decoration:none}
.grid .c-name{text-align:left;position:sticky;left:0;z-index:1;background:var(--surface);min-width:132px;border-right:1px solid var(--line)}
@media (min-width:760px){.grid .c-name{min-width:220px}}
.grid thead th.c-name{background:var(--sunk);padding-left:14px;font-family:var(--f-body);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.grid tr.gr th{border-top:1px solid var(--line);background:var(--surface);text-align:left;padding:14px 14px 6px;position:static}
.grid tr.gr:first-child th{border-top:0}
.grid tr.gr .gl{position:sticky;left:14px;display:inline-flex;gap:8px;align-items:center;font-family:var(--f-display);font-weight:700;font-size:14.5px;color:var(--ink)}
.grid tr.gr .gl .dot{width:10px;height:10px;border-radius:2px;background:var(--gcol)}
.grid tr.gr .gl .n{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.cl{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;padding:10px 10px 10px 14px;cursor:pointer}
.cl:hover{background:var(--hover)}
.cl .n{font-weight:600;font-size:14.5px;line-height:1.25}
.cl .s{font-size:12px;color:var(--muted)}
.cl .s.hot{color:var(--soon);font-weight:600}
td.cw{width:58px;padding:6px 3px}
.cell{width:100%;min-width:44px;font-size:12px;font-weight:700;padding:8px 2px;border-radius:7px;border:1px solid transparent;cursor:pointer;letter-spacing:.01em}
.cell:hover{filter:brightness(.97)}

<script>
var G = (function(){
  "use strict";
  var DAY = 86400000;
  var MESOS = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];
  var MESC = ["gen.","febr.","març","abr.","maig","juny","jul.","ag.","set.","oct.","nov.","des."];
  var DIES = ["diumenge","dilluns","dimarts","dimecres","dijous","divendres","dissabte"];
  var eurF = new Intl.NumberFormat("ca-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
  var pctF = new Intl.NumberFormat("ca-ES",{maximumFractionDigits:1,minimumFractionDigits:1});

  function eur(n){ return (n==null || isNaN(n)) ? "—" : eurF.format(n); }
  function fPct(v){ return (v>0?"+":"")+pctF.format(v)+" %"; }
  function pad(n){ return (n<10?"0":"")+n; }
  function today(){ var d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parse(s){ var a=String(s).split("-").map(Number); return new Date(a[0], a[1]-1, a[2]||1); }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
  function addMonths(d,n){
    var t = new Date(d.getFullYear(), d.getMonth()+n, 1);
    var last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
    t.setDate(Math.min(d.getDate(), last));
    return t;
  }
  function daysTo(s){ return Math.round((parse(s) - today())/DAY); }
  function fShort(s){ var d=parse(s); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); }
  function fDM(s){ var d=parse(s); return pad(d.getDate())+"/"+pad(d.getMonth()+1); }
  function fDayMon(s){ var d=parse(s); return d.getDate()+" "+MESC[d.getMonth()]; }
  function monthPhrase(d){ var m=MESOS[d.getMonth()]; return (/^[aeiouà]/.test(m) ? "d’" : "de ")+m; }
  function longDate(s){ var d=parse(s); return d.getDate()+" "+monthPhrase(d)+" de "+d.getFullYear(); }
  function dayMonth(s){ var d=parse(s); return d.getDate()+" "+monthPhrase(d); }
  function artDate(s){ var d=parse(s), n=d.getDate(); return (n===1||n===11 ? "l’" : "el ")+n+" "+monthPhrase(d); }
  function delDate(s){ var d=parse(s), n=d.getDate(); return (n===1||n===11 ? "de l’" : "del ")+n+" "+monthPhrase(d); }
  function weekday(s){ return DIES[parse(s).getDay()]; }
  function rel(n){
    if(n===0) return "avui";
    if(n===1) return "demà";
    if(n===-1) return "ahir";
    if(n<-90) return "fa "+Math.round(-n/30.44)+" mesos";
    if(n<0) return "fa "+(-n)+" dies";
    if(n>90) return "d’aquí a "+Math.round(n/30.44)+" mesos";
    return "d’aquí a "+n+" dies";
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
  function $(id){ return document.getElementById(id); }

  function load(key){ try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
  function store(key, v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} }

  var tt = null;
  function toast(t){
    var el = $("toast"); if(!el) return;
    el.textContent = t; el.hidden = false;
    clearTimeout(tt); tt = setTimeout(function(){ el.hidden = true; }, 2800);
  }

  var lastFocus = null;
  function sheetOpen(){ return !$("bd").hidden; }
  function openSheet(html, focusSel){
    var bd = $("bd"), sh = $("sheet");
    sh.innerHTML = html;
    if(bd.hidden){
      lastFocus = document.activeElement;
      bd.hidden = false;
      document.documentElement.style.overflow = "hidden";
      requestAnimationFrame(function(){ bd.classList.add("open"); });
      sh.scrollTop = 0;
    }
    var f = sh.querySelector(focusSel || '[data-act="close"]');
    if(f) f.focus({preventScroll:true});
  }
  function closeSheet(focusEl){
    var bd = $("bd");
    if(bd.hidden) return;
    bd.classList.remove("open");
    bd.hidden = true;
    document.documentElement.style.overflow = "";
    var f = focusEl || lastFocus;
    if(f && document.body.contains(f)) f.focus({preventScroll:true});
  }

  function copyText(text, selectEl, okMsg){
    function fallback(){
      if(selectEl){ selectEl.focus(); selectEl.select(); toast("Text seleccionat. Copia’l amb Ctrl+C o mantenint-lo premut."); }
      else copyBox("Text per copiar", text);
    }
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
      } else fallback();
    } catch(e){ fallback(); }
  }
  function copyBox(title, text, hint){
    openSheet('<div class="s-head"><div><h2 id="s-title">'+esc(title)+'</h2></div><button type="button" class="x" data-act="close" aria-label="Tanca">×</button></div>'+
      (hint ? '<p class="hint">'+esc(hint)+'</p>' : '')+
      '<textarea id="cbox" class="msg" rows="14" readonly>'+esc(text)+'</textarea>'+
      '<div><button type="button" class="btn" data-act="copybox">Copia-ho tot</button></div>', "#cbox");
  }
  document.addEventListener("click", function(e){
    if(e.target.closest && e.target.closest('[data-act="copybox"]')){ var b=$("cbox"); if(b) copyText(b.value, b, "Copiat."); }
  });

  // Botó de confirmació en dos tocs (el visor no mostra confirm()).
  function arm(btn, armedText){
    if(btn.getAttribute("data-armed")==="1"){ btn.removeAttribute("data-armed"); return true; }
    var normal = btn.textContent;
    btn.setAttribute("data-armed","1"); btn.textContent = armedText;
    setTimeout(function(){ if(document.body.contains(btn) && btn.getAttribute("data-armed")==="1"){ btn.removeAttribute("data-armed"); btn.textContent = normal; } }, 4000);
    return false;
  }

  /* ---------- Desament ----------
     Mode local: cada eina guarda les dades al navegador (versió de prova).
     Mode "sheets": sync.js substitueix start() i save() per llegir i escriure al full de càlcul del Drive. */
  var current = null;
  function start(s, onData){
    current = s;
    var d = load(s.key);
    if(!s.valid(d)) d = s.seed();
    onData(d);
  }
  function save(d){ if(current) store(current.key, d); }

  /* Conversió de files del full de càlcul */
  function objs(table){
    if(!table || !table.length) return [];
    var head = table[0].map(function(h){ return String(h).trim(); });
    return table.slice(1).map(function(r){ var o={}; head.forEach(function(h,i){ o[h] = r[i]==null ? "" : r[i]; }); return o; });
  }
  function num(v){
    if(v===""||v==null) return null;
    if(typeof v==="number") return v;
    var s = String(v).replace(/[€\s]/g,"");
    if(s.indexOf(",")>=0) s = s.replace(/\./g,"").replace(",",".");
    var n = parseFloat(s); return isNaN(n) ? null : n;
  }
  function str(v){ return v==null ? "" : String(v); }
  function bool(v){ return v===true || /^(true|s|si|sí|1|x)$/i.test(String(v).trim()); }
  function dateStr(v){
    if(typeof v==="number"){ return iso(new Date(1899, 11, 30 + Math.floor(v))); }
    var s = String(v||"").trim(), m;
    if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
    if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);
    return "";
  }
  function jsonArr(v){ try { var a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
  function blank(v){ return v==null ? "" : v; }

  return {DAY:DAY, MESOS:MESOS, MESC:MESC, DIES:DIES, eur:eur, fPct:fPct, pad:pad, today:today, parse:parse, iso:iso,
    addDays:addDays, addMonths:addMonths, daysTo:daysTo, fShort:fShort, fDM:fDM, fDayMon:fDayMon, longDate:longDate,
    dayMonth:dayMonth, artDate:artDate, delDate:delDate, weekday:weekday, rel:rel, esc:esc, norm:norm, $:$,
    load:load, store:store, toast:toast, openSheet:openSheet, closeSheet:closeSheet, sheetOpen:sheetOpen,
    copyText:copyText, copyBox:copyBox, arm:arm, mode:"local", start:start, save:save,
    objs:objs, num:num, str:str, bool:bool, dateStr:dateStr, jsonArr:jsonArr, blank:blank};
})();

/* Accés amb Google i desament al full de càlcul (versió publicada a GitHub Pages).
   L'entrada es fa a la portada, sempre amb el selector de comptes de Google. Les eines reutilitzen
   la sessió d'aquella pestanya; si no n'hi ha, tornen a la portada. El full només és compartit amb
   els comptes autoritzats, així que un compte sense permís rep un error de l'API i no veu res. */
(function(){
  "use strict";
  var C = window.GALINDO_CONFIG || {};
  var API = "https://sheets.googleapis.com/v4/spreadsheets/";
  var SHEETS_SCOPE = "https://www.googleapis.com/auth/spreadsheets";
  var SCOPE = SHEETS_SCOPE+" openid email";
  var TOKEN_KEY = "galindo-token";
  var TOOLS = ["venciments","trimestrals","caducitats"];
  var PAGE = (location.pathname.split("/").pop() || "").replace(/\.html$/,"");
  var esc = G.esc;

  var token = null, tokenExp = 0, email = "", tc = null, pendingCb = null;
  var gateEl = null, statusEl = null;
  // Estat de les eines
  var S = null, onData = null, data = null, counts = {};
  var dirty = false, saving = false, saveT = null, lastLoad = 0, afterLogin = null;
  // Estat de la portada
  var portalVerify = null, portalGate = null;

  function hhmm(){ var d=new Date(); return G.pad(d.getHours())+":"+G.pad(d.getMinutes()); }
  function configured(){ return !!(C.clientId && C.spreadsheetId); }

  /* ---------- Sessió (només dins d'aquesta pestanya) ---------- */
  function readSession(){
    try { var s = JSON.parse(sessionStorage.getItem(TOKEN_KEY)||"null");
      if(s && s.t && s.e > Date.now()){ token = s.t; tokenExp = s.e; email = s.m || ""; return true; } } catch(e){}
    return false;
  }
  function writeSession(){ try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({t:token, e:tokenExp, m:email})); } catch(e){} }
  function clearSession(){ token = null; tokenExp = 0; email = ""; try { sessionStorage.removeItem(TOKEN_KEY); } catch(e){} }
  function toPortal(){ location.replace("./"+(TOOLS.indexOf(PAGE)>=0 ? "?torna="+PAGE : "")); }

  /* ---------- Interfície ---------- */
  function ui(){
    document.documentElement.classList.add("locked");
    var demo = document.querySelector(".demo"); if(demo) demo.hidden = true;
    var bar = document.querySelector(".brandbar");
    statusEl = document.createElement("div"); statusEl.className = "sync"; statusEl.hidden = true; statusEl.setAttribute("role","status");
    bar.appendChild(statusEl);
    gateEl = document.createElement("section"); gateEl.className = "gate"; gateEl.setAttribute("aria-live","polite");
    bar.insertAdjacentElement("afterend", gateEl);
  }
  function gate(title, text, btns){
    gateEl.innerHTML = (title ? '<h2>'+esc(title)+'</h2>' : '')+(text ? '<p>'+text+'</p>' : '')+
      (btns && btns.length ? '<div class="gate-btns">'+btns.map(function(b,i){ return '<button type="button" class="btn'+(i===0?' primary':'')+'" data-sync="'+b[0]+'">'+esc(b[1])+'</button>'; }).join("")+'</div>' : '');
    gateEl.hidden = false;
    document.documentElement.classList.add("locked");
  }
  function unlock(){ gateEl.hidden = true; document.documentElement.classList.remove("locked"); }
  function status(kind, text, btns){
    statusEl.hidden = false;
    statusEl.className = "sync s-"+kind;
    statusEl.innerHTML = '<span class="sd" aria-hidden="true"></span><span class="st">'+text+'</span>'+
      (btns||[]).map(function(b){ return '<button type="button" class="linkbtn" data-sync="'+b[0]+'">'+esc(b[1])+'</button>'; }).join("");
  }
  function okStatus(){ status("ok", "Desat al Drive · "+hhmm()+(email ? " · "+esc(email) : "")); }

  /* ---------- Google ---------- */
  function gisReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); }
  function whenGis(cb){
    var tries = 0;
    (function wait(){
      if(gisReady()){ initClient(); cb(true); return; }
      if(++tries > 100){ cb(false); return; }
      setTimeout(wait, 100);
    })();
  }
  function initClient(){
    if(tc) return true;
    if(!gisReady()) return false;
    tc = google.accounts.oauth2.initTokenClient({
      client_id: C.clientId, scope: SCOPE,
      callback: function(r){ var f = pendingCb; pendingCb = null; handleToken(r, f); },
      error_callback: function(err){ var f = pendingCb; pendingCb = null; if(f) f({error:(err && err.type) || "unknown"}); }
    });
    return true;
  }
  // choose=true obre sempre el selector de comptes; si no, torna a entrar amb el compte ja triat.
  function requestLogin(choose, done){
    if(!initClient()){ done({error:"nogis"}); return; }
    pendingCb = done;
    var o = choose ? {prompt:"select_account"} : {prompt:""};
    if(!choose && email) o.login_hint = email;
    tc.requestAccessToken(o);
  }
  function handleToken(r, done){
    done = done || function(){};
    if(!r || r.error){ done({error:(r && r.error) || "unknown"}); return; }
    if(!google.accounts.oauth2.hasGrantedAllScopes(r, SHEETS_SCOPE)){ done({error:"scope"}); return; }
    token = r.access_token;
    tokenExp = Date.now() + (Number(r.expires_in)||3600)*1000 - 60000;
    fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers:{Authorization:"Bearer "+token}})
      .then(function(x){ return x.ok ? x.json() : {}; })
      .then(function(j){ email = j.email || ""; }, function(){})
      .then(function(){ writeSession(); done({ok:true}); });
  }
  function loginError(code){
    switch(code){
      case "access_denied": return "Google no ha donat accés a aquest compte. Comprova que és un dels comptes autoritzats.";
      case "scope": return "Cal marcar la casella del permís per veure i editar els fulls de càlcul.";
      case "popup_closed": return "Has tancat la finestra de Google abans d’acabar.";
      case "popup_failed_to_open": return "El navegador ha bloquejat la finestra de Google. Permet les finestres emergents per a aquesta pàgina.";
      case "nogis": return "No s’ha pogut connectar amb Google. Torna a carregar la pàgina.";
      default: return "No s’ha pogut entrar amb Google.";
    }
  }

  /* ---------- API ---------- */
  function api(method, url, body){
    if(!token || Date.now()>tokenExp) return Promise.reject({auth:true});
    return fetch(url, {method:method, headers:{"Authorization":"Bearer "+token, "Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined})
      .then(function(r){
        if(r.status===401) throw {auth:true};
        if(r.status===403 || r.status===404) throw {denied:true};
        if(!r.ok) return r.text().then(function(t){ throw {msg:"L’API de Google ha respost amb l’error "+r.status+".", detail:t}; });
        return r.json();
      }, function(){ throw {offline:true}; });
  }
  function errText(e){ return e && e.offline ? "No hi ha connexió amb Google. Comprova la connexió a internet." : ((e && e.msg) || "Error desconegut."); }

  /* ---------- Portada ---------- */
  function portal(){
    ui();
    if(!configured()){ gate("Falta acabar la configuració", "Cal posar l’identificador d’accés de Google al fitxer <code>config.js</code> del repositori.", []); return; }
    var torna = new URLSearchParams(location.search).get("torna");
    var target = TOOLS.indexOf(torna)>=0 ? torna+".html" : null;
    portalGate = function(msg){
      gate("Entra amb el teu compte de Google",

    var vis = data.clients.filter(visible);
    if(!data.clients.length){
      $("list").innerHTML = '<div class="empty"><p>Encara no hi ha cap client.</p><button type="button" class="btn primary" data-act="new">+ Afegeix el primer</button></div>';
      return;
    }
    if(!vis.length){
      $("list").innerHTML = '<div class="empty"><p>'+(data.clients.some(function(c){ return modelsIn(c,sel).length; }) ? 'Cap client coincideix amb aquests filtres.' : 'En aquest termini no hi ha cap model dels teus clients.')+'</p><button type="button" class="btn" data-act="clearall">Treu els filtres</button></div>';
      return;
    }
    var cols = ORDER.filter(function(m){ return sel.models[m] && vis.some(function(c){ return c.models.indexOf(m)>=0; }); });
    var GR = [["falta","Falten papers","var(--late)"],["rebut","Papers rebuts, per preparar","var(--soon)"],["fet","Tot presentat","var(--ok)"]];
    var by = {falta:[], rebut:[], fet:[]};
    vis.forEach(function(c){ by[stateOf(c, sel)].push(c); });
    var body = GR.filter(function(g){ return by[g[0]].length; }).map(function(g){
      var items = by[g[0]].sort(function(a,b){
        var da = clientDeadline(a,sel)||"9", db = clientDeadline(b,sel)||"9";
        return da<db ? -1 : da>db ? 1 : a.nom.localeCompare(b.nom,"ca");
      });
      return '<tbody style="--gcol:'+g[2]+'"><tr class="gr"><th colspan="'+(cols.length+1)+'"><span class="gl"><span class="dot"></span>'+g[1]+' <span class="n">'+items.length+'</span></span></th></tr>'+
        items.map(function(c){
          var dl = clientDeadline(c, sel), dd = dl ? daysTo(dl) : null;
          var sub = c.tipus+(c.dom ? ' · domiciliat' : '')+(dl ? ' · fins al '+fDM(dl) : '');
          return '<tr><th class="c-name" scope="row"><button type="button" class="cl" data-cl="'+c.id+'"><span class="n">'+esc(c.nom)+'</span><span class="s'+(dd!=null && dd<=3 && dd>=0 ? ' hot' : '')+'">'+sub+'</span></button></th>'+
            cols.map(function(m){
              if(c.models.indexOf(m)<0) return '<td class="na" aria-label="No el presenta">·</td>';
              var s = getSt(sel.key, c.id, m).s;
              return '<td class="cw"><button type="button" class="cell c-'+s+'" data-cl="'+c.id+'" data-m="'+m+'" aria-label="'+esc(c.nom)+', model '+m+': '+ST[s]+'. Toca per passar a '+ST[NEXT[s]].toLowerCase()+'">'+SHORT[s]+'</button></td>';
            }).join("")+'</tr>';
        }).join("")+'</tbody>';
    }).join("");
    $("list").innerHTML = '<div class="panel tblwrap"><table class="grid"><thead><tr><th class="c-name" scope="col">Client</th>'+
      cols.map(function(m){ return '<th scope="col"><abbr title="'+MODELS[m].nom+'">'+m+'</abbr></th>'; }).join("")+'</tr></thead>'+body+'</table></div>';
  }
  function renderMain(){ renderHeader(); renderCamps(); renderTerms(); renderStats(); renderList(); }

  /* ---------- Missatges ---------- */
  function msg(c, camp){
    var g = c.tipus!=="Autònom", nom = c.nom.split(" ")[0];
    var salut = g ? "Bon dia, us escric de la gestoria." : "Hola "+nom+", t’escric de la gestoria.";
    var ms = modelsIn(c, camp);
    if(!ms.length) return "";
    var falta = ms.filter(function(m){ return getSt(camp.key,c.id,m).s==="falta"; });
    var dl = clientDeadline(c, camp);
    if(falta.length){
      var docs = []; falta.forEach(function(m){ if(docs.indexOf(MODELS[m].docs)<0) docs.push(MODELS[m].docs); });
      var t = salut+" Per presentar "+camp.periode+" em falten "+joinCat(docs)+".";
      if(dl) t += (c.dom && daysTo(camp.models[falta[0]].dom)>=0) ? " Com que el pagament està domiciliat, el termini acaba "+artDate(dl)+"." : " El termini acaba "+artDate(dl)+".";
      return t+(g ? " Quan ho tingueu, envieu-m’ho i ho deixem enllestit." : " Quan ho tinguis, envia-m’ho i ho deixem enllestit.")+" Gràcies!";
    }
    var reb = ms.filter(function(m){ return getSt(camp.key,c.id,m).s==="rebut"; });
    if(reb.length){
      return salut+" Ja tinc tots els papers per presentar "+camp.periode+". Ho presentaré abans "+delDate(dl)+" i "+(g?"us":"et")+" diré què surt. Gràcies!";
    }
    var parts = [], ingr = 0;
    ms.forEach(function(m){
      var imp = getSt(camp.key,c.id,m).imp;
      if(imp==null) return;
      if(imp>0){ parts.push(MODELS[m].curt+", "+eur(imp)+" a ingressar"); ingr += imp; }
      else if(imp<0) parts.push(MODELS[m].curt+", "+eur(-imp)+" a compensar");
      else parts.push(MODELS[m].curt+", sense quota");
    });
    var t2 = salut+" Ja hem presentat "+camp.periode+".";
    if(parts.length) t2 += (parts.length>1 ? " Resultats: " : " Resultat: ")+parts.join("; ")+".";
    if(ingr>0){
      var lastPres = ms.reduce(function(a,m){ return camp.models[m].pres>a ? camp.models[m].pres : a; }, "");
      t2 += c.dom ? " El banc ho cobrarà "+artDate(lastPres)+"." : (g ? " Us enviem" : " T’envio")+" el document per pagar-ho abans "+delDate(lastPres)+".";
    }
    return t2+" Gràcies!";
  }

  /* ---------- Fitxa del client ---------- */
  var openId = null;
  function detailHTML(c){
    var ms = modelsIn(c, sel), dl = clientDeadline(c, sel), st = stateOf(c, sel);
    var due;
    if(!ms.length) due = '<div class="due"><span class="due-d">No presenta res en aquest termini</span></div>';
    else if(st==="fet") due = '<div class="due good"><span class="due-d">Tot presentat</span><span class="due-r">'+sel.label+' · '+sel.tag+'</span></div>';
    else { var d = daysTo(dl); due = '<div class="due '+(d<=3?'late':(d<=10?'soon':''))+'"><span class="due-d">Fins al '+weekday(dl)+' '+dayMonth(dl)+'</span><span class="due-r">'+rel(d)+'</span></div>'; }
    var note = domLost(c, sel)
      ? '<p class="note bad">La domiciliació ja s’ha tancat i encara hi ha models per presentar. Es poden presentar fins al <b>'+fShort(sel.last)+'</b>, però el client haurà de pagar amb document d’ingrés al banc.</p>'
      : (c.dom ? '<p class="note">Pagament domiciliat: el termini per presentar és més curt, però el banc cobra l’últim dia del període.</p>' : '');
    var decls = ms.map(function(m){
      var s = getSt(sel.key, c.id, m), t = modelDeadline(c, sel, m);
      return '<div class="decl"><div class="dh"><span class="code">'+m+'</span><span class="nm">'+MODELS[m].nom+'</span><span class="dl">fins al '+fDM(t)+'</span></div>'+
        '<div class="seg">'+Object.keys(ST).map(function(k){ return '<button type="button" data-ms="'+m+':'+k+'" aria-pressed="'+(s.s===k)+'">'+ST[k]+'</button>'; }).join("")+'</div>'+
        '<label class="fld">Resultat (€) <span class="opt">positiu a ingressar, negatiu a compensar</span><input id="imp-'+m+'" data-imp="'+m+'" type="number" inputmode="decimal" step="1" value="'+(s.imp==null?'':s.imp)+'"></label></div>';
    }).join("");
    var mtext = msg(c, sel);
    return ''+
      '<div class="s-head"><div><span class="tag">'+esc(c.tipus)+'</span><h2 id="s-title">'+esc(c.nom)+'</h2><p class="s-sub">'+esc(c.act)+'</p></div>'+
        '<button type="button" class="x" data-act="close" aria-label="Tanca la fitxa">×</button></div>'+
      due+note+
      (ms.length ? '<section class="s-sec"><h3>'+sel.label+' · '+sel.tag+'</h3>'+decls+'</section>' : '')+
      (mtext ? '<section class="s-sec"><h3>Missatge per al client</h3><textarea id="d-msg" class="msg" readonly rows="6" aria-label="Missatge per al client">'+esc(mtext)+'</textarea>'+
        '<div><button type="button" class="btn" data-act="copymsg">Copia el missatge</button></div></section>' : '')+
      '<section class="s-sec"><h3>Models que presenta</h3><div class="checks">'+ORDER.map(function(m){
        return '<label title="'+MODELS[m].nom+'"><input type="checkbox" data-model="'+m+'"'+(c.models.indexOf(m)>=0?' checked':'')+'> '+m+'</label>';
      }).join("")+'</div><label class="check"><input type="checkbox" id="d-dom"'+(c.dom?' checked':'')+'> Pagament domiciliat</label></section>'+
      '<section class="s-sec"><h3>Contacte</h3><dl class="kv"><dt>Telèfon</dt><dd>'+(c.tel ? '<span class="mono">'+esc(c.tel)+'</span><button type="button" class="mini" data-act="copytel">Copia</button>' : '—')+'</dd></dl></section>'+
      '<section class="s-sec"><h3>Notes</h3><textarea id="d-notes" rows="3" placeholder="Com porta els papers, a qui cal trucar…">'+esc(c.notes)+'</textarea></section>'+
      '<div class="s-foot"><button type="button" class="btn danger" data-act="del">Elimina el client</button></div>';
  }
  function showDetail(id, keepScroll){
    var c = byId(id); if(!c) return;
    openId = id;
    var sh = $("sheet"), st = sh.scrollTop;
    G.openSheet(detailHTML(c));
    if(keepScroll) sh.scrollTop = st;
  }
  function closeSheet(){
    var id = openId; openId = null;
    G.closeSheet(id ? document.querySelector('.cl[data-cl="'+id+'"]') : null);
  }
  function refreshMsg(c){ var m=$("d-msg"); if(m) m.value = msg(c, sel); }

  /* ---------- Nou client ---------- */
  function newForm(){
    openId = null;
    G.openSheet(''+
      '<div class="s-head"><div><h2 id="s-title">Nou client</h2></div><button type="button" class="x" data-act="close" aria-label="Tanca">×</button></div>'+
      '<form class="nf" id="nf" novalidate>'+
        '<label class="fld">Nom o raó social<input id="n-nom" required autocomplete="off"></label>'+
        '<div class="two"><label class="fld">Tipus<select id="n-tipus">'+TIPUS_CL.map(function(t){ return '<option>'+t+'</option>'; }).join("")+'</select></label>'+
        '<label class="fld">Telèfon<input id="n-tel" type="tel" autocomplete="off"></label></div>'+
        '<label class="fld">Activitat<input id="n-act" autocomplete="off"></label>'+
        '<div class="s-sec"><h3>Models que presenta</h3><div class="checks" id="n-models">'+ORDER.map(function(m){
          return '<label title="'+MODELS[m].nom+'"><input type="checkbox" value="'+m+'"'+(DEF_MODELS["Autònom"].indexOf(m)>=0?' checked':'')+'> '+m+'</label>';
        }).join("")+'</div></div>'+
        '<label class="check"><input type="checkbox" id="n-dom"> Pagament domiciliat</label>'+
        '<p class="err" id="n-err" hidden></p>'+
        '<div><button class="btn primary" type="submit">Afegeix el client</button></div>'+
      '</form>', "#n-nom");
  }
  function submitNew(){
    var nom = $("n-nom").value.trim(), err = $("n-err");
    var ms = Array.prototype.map.call(document.querySelectorAll('#n-models input:checked'), function(i){ return i.value; });
    if(!nom){ err.textContent = "Falta el nom del client."; err.hidden=false; $("n-nom").focus(); return; }
    if(!ms.length){ err.textContent = "Marca com a mínim un model."; err.hidden=false; return; }
    var id = "c"+Date.now().toString(36);
    data.clients.push({id:id, nom:nom, tipus:$("n-tipus").value, act:$("n-act").value.trim(), models:ms, dom:$("n-dom").checked, tel:$("n-tel").value.trim(), notes:""});
    save(); renderMain(); G.closeSheet(); toast("Client afegit.");
    var b = document.querySelector('.cl[data-cl="'+id+'"]'); if(b){ b.scrollIntoView({block:"center"}); b.focus({preventScroll:true}); }
  }

  function reminders(){
    var list = data.clients.filter(function(c){ return modelsIn(c,sel).some(function(m){ return getSt(sel.key,c.id,m).s==="falta"; }); });
    list.sort(function(a,b){ var da=clientDeadline(a,sel)||"9", db=clientDeadline(b,sel)||"9"; return da<db?-1:da>db?1:0; });
    if(!list.length){ toast("Ningú deu papers en aquest termini."); return; }
    var text = list.map(function(c){ return "— "+c.nom+(c.tel?" ("+c.tel+")":"")+"\n"+msg(c, sel); }).join("\n\n");
    G.copyBox("Recordatoris de papers", text, list.length+" clients deuen papers per a "+sel.label.toLowerCase()+". Copia cada missatge al WhatsApp o al correu del client.");
  }

  /* ---------- Esdeveniments ---------- */
  document.addEventListener("click", function(e){
    var t = e.target;
    var cell = t.closest(".cell[data-m]");
    if(cell){
      var cid = cell.getAttribute("data-cl"), m = cell.getAttribute("data-m"), s = getSt(sel.key,cid,m).s;
      setSt(sel.key, cid, m, {s:NEXT[s]}); save(); renderStats(); renderList();
      var again = document.querySelector('.cell[data-cl="'+cid+'"][data-m="'+m+'"]'); if(again) again.focus({preventScroll:true});
      return;
    }
    var cl = t.closest(".cl"); if(cl){ showDetail(cl.getAttribute("data-cl")); return; }
    var cp = t.closest(".camp"); if(cp){ var k=cp.getAttribute("data-camp"); SHOWN.forEach(function(c){ if(c.key===k) sel=c; }); renderMain(); return; }
    var ch = t.closest(".chip"); if(ch){ F.tipus = ch.getAttribute("data-tipus"); Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(x){ x.setAttribute("aria-pressed", String(x===ch)); }); renderList(); return; }
    var ms = t.closest("[data-ms]");
    if(ms && openId){
      var parts = ms.getAttribute("data-ms").split(":"), c = byId(openId);
      setSt(sel.key, c.id, parts[0], {s:parts[1]}); save(); renderMain(); showDetail(c.id, true); return;
    }
    var act = t.closest("[data-act]");
    if(act){
      var a = act.getAttribute("data-act");
      if(a==="close"){ closeSheet(); return; }
      if(a==="new"){ newForm(); return; }
      if(a==="clearall"){ F={q:"",tipus:"",hide:false}; $("q").value=""; $("f-hide").checked=false; Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(x){ x.setAttribute("aria-pressed", String(x.getAttribute("data-tipus")==="")); }); renderList(); return; }
      var c2 = openId && byId(openId);
      if(a==="copymsg" && c2){ G.copyText($("d-msg").value, $("d-msg"), "Missatge copiat."); return; }
      if(a==="copytel" && c2){ G.copyText(c2.tel.replace(/\s+/g,""), null, "Telèfon copiat."); return; }
      if(a==="del" && c2){
        if(!G.arm(act, "Toca un altre cop per eliminar-lo")) return;
        data.clients = data.clients.filter(function(x){ return x.id!==c2.id; });
        Object.keys(data.st).forEach(function(k){ delete data.st[k][c2.id]; });
        save(); openId=null; G.closeSheet(); renderMain(); toast("Client eliminat."); return;
      }
    }
    if(t === $("bd")) closeSheet();
  });
  $("sheet").addEventListener("change", function(e){
    var el = e.target, c = openId && byId(openId);
    if(el.id==="n-tipus"){
      var defs = DEF_MODELS[el.value] || [];
      Array.prototype.forEach.call(document.querySelectorAll('#n-models input'), function(i){ i.checked = defs.indexOf(i.value)>=0; });
      return;
    }
    if(!c) return;
    if(el.hasAttribute("data-imp")){
      var v = parseFloat(el.value); setSt(sel.key, c.id, el.getAttribute("data-imp"), {imp:isNaN(v)?null:v}); save(); refreshMsg(c); return;
    }
    if(el.hasAttribute("data-model")){
      var m = el.getAttribute("data-model");
      if(el.checked){ if(c.models.indexOf(m)<0) c.models.push(m); } else c.models = c.models.filter(function(x){ return x!==m; });
      c.models.sort(function(a,b){ return ORDER.indexOf(a)-ORDER.indexOf(b); });
      save(); renderMain(); showDetail(c.id, true); return;
    }
    if(el.id==="d-dom"){ c.dom = el.checked; save(); renderMain(); showDetail(c.id, true); return; }
    if(el.id==="n-tipus"){
      var def = DEF_MODELS[el.value] || [];
      Array.prototype.forEach.call(document.querySelectorAll('#n-models input'), function(i){ i.checked = def.indexOf(i.value)>=0; });
    }
  });
  var nt = null;
  $("sheet").addEventListener("input", function(e){
    if(e.target.id!=="d-notes" || !openId) return;
    var c = byId(openId); if(!c) return;
    c.notes = e.target.value; clearTimeout(nt); nt = setTimeout(save, 400);
  });
  $("sheet").addEventListener("submit", function(e){ if(e.target.id==="nf"){ e.preventDefault(); submitNew(); } });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });
  $("q").addEventListener("input", function(e){ F.q = e.target.value; renderList(); });
  $("f-hide").addEventListener("change", function(e){ F.hide = e.target.checked; renderList(); });
  $("b-new").addEventListener("click", newForm);
  $("b-rem").addEventListener("click", reminders);
  $("b-reset").addEventListener("click", function(e){
    if(!G.arm(e.currentTarget, "Segur? Es perden els canvis. Toca un altre cop")) return;
    e.currentTarget.textContent = "Torna a les dades de prova";
    data = seed(); save(); openId=null; G.closeSheet(); sel = CAMPS[CUR]; renderMain(); toast("Dades de prova restablertes.");
  });

  G.start(STORE, function(d){ data = d; renderMain(); });
})();
</script>

</body>
</html>
